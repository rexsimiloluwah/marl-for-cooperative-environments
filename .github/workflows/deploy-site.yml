name: deploy site

# Builds the website and publishes it to GitHub Pages on every push to main.
#
# ONE-TIME SETUP
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# That is all. No branch to create, no token to add.
#
# THE BASE PATH
# A project site is served from https://<owner>.github.io/<repo>/, so every
# internal path needs that prefix. Both values are derived from the repository
# below rather than hardcoded, so renaming or transferring the repo needs no
# change here.
#
# For a custom domain: add the domain in Settings -> Pages, put a CNAME file in
# public/, and set BASE_PATH to `/` in the build step. The site then serves
# from the root and the prefix disappears on its own.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repo, write the Pages deployment, mint the OIDC token Pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. `cancel-in-progress: false` so a queued run
# finishes rather than being dropped half way through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Work out where the site will live
        id: target
        run: |
          # github.repository is "owner/repo"
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "$repo" = "${owner}.github.io" ]; then
            # a user or organisation site serves from the root
            echo "site=https://${owner}.github.io" >> "$GITHUB_OUTPUT"
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "site=https://${owner}.github.io" >> "$GITHUB_OUTPUT"
            echo "base=/${repo}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          PUBLIC_SITE_URL: ${{ steps.target.outputs.site }}
          PUBLIC_BASE_PATH: ${{ steps.target.outputs.base }}
        run: npm run build

      # A broken internal link is invisible until someone clicks it, and a base
      # path is exactly what breaks them, so the audit gates the deployment.
      - name: Audit internal links
        env:
          PUBLIC_BASE_PATH: ${{ steps.target.outputs.base }}
        run: python3 scripts/qa/links.py

      - name: Check the base path was actually applied
        env:
          BASE: ${{ steps.target.outputs.base }}
        run: |
          if [ "$BASE" = "/" ]; then
            echo "root deployment, nothing to check"
            exit 0
          fi
          # Every asset reference must carry the prefix. If Astro's base were
          # ignored, these would be bare /_astro/ paths and every page would
          # load unstyled.
          if grep -qo 'href="/_astro/' dist/index.html; then
            echo "::error::assets are not prefixed with $BASE; the site would load unstyled"
            exit 1
          fi
          grep -o "href=\"$BASE/_astro/[^\"]*\"" dist/index.html | head -3
          echo "base path applied"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
