name: publish cooperative-marl-labs

# Publishes the package to PyPI when you push to the `release` branch.
#
# Nothing here can publish from `main`. Merging to `main` runs the tests only;
# releasing is a separate, deliberate push to `release`.
#
# ONE-TIME SETUP, pick ONE of the two
#
# 0.1.0 was published from a laptop with twine, so the project already exists
# on PyPI: https://pypi.org/project/cooperative-marl-labs/
#
# OPTION A - API token. Works immediately, no PyPI web setup.
#   In this repository: Settings -> Secrets and variables -> Actions ->
#   New repository secret, named PYPI_API_TOKEN, value the pypi-... token.
#   Use a PROJECT-SCOPED token now that the project exists:
#   https://pypi.org/manage/project/cooperative-marl-labs/settings/
#
# OPTION B - trusted publishing. Preferred, because no token is stored at all.
#   https://pypi.org/manage/project/cooperative-marl-labs/settings/publishing/
#      Owner            : rexsimiloluwah
#      Repository name  : marl-for-cooperative-environments
#      Workflow name    : publish-cooperative-marl-labs.yml
#      Environment name : pypi
#   Then leave PYPI_API_TOKEN unset and this workflow uses OIDC instead.
#
# Either way, create the environments so the upload has a gate:
#   Settings -> Environments -> New environment -> `pypi` (and `testpypi`).
#   Add yourself as a required reviewer for a manual approval before upload.
#
# HOW TO RELEASE
#
#   bump the version in cooperative-marl-labs/pyproject.toml AND in
#   src/cooperative_marl_labs/__init__.py, commit, then
#
#     git push origin main:release
#
# PyPI refuses to overwrite a version that already exists, and `skip-existing`
# below turns that into a skip rather than a failed run. So pushing `release`
# twice without a version bump is harmless.

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

defaults:
  run:
    working-directory: cooperative-marl-labs

jobs:
  # ---------------------------------------------------------------- 1. verify
  test:
    name: test and build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,learning]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  # -------------------------------------------- 2. the version must be honest
  version:
    name: check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pyproject and __init__ must agree
        id: read
        run: |
          python - <<'PY'
          import os, pathlib, re, sys, tomllib

          root = pathlib.Path("cooperative-marl-labs")
          meta = tomllib.loads((root / "pyproject.toml").read_text())
          declared = meta["project"]["version"]

          source = (root / "src/cooperative_marl_labs/__init__.py").read_text()
          match = re.search(r'__version__ = "([^"]+)"', source)
          if match is None:
              sys.exit("no __version__ in __init__.py")
          runtime = match.group(1)

          print(f"pyproject.toml : {declared}")
          print(f"__init__.py    : {runtime}")
          if declared != runtime:
              sys.exit(
                  "version mismatch. Bump both, or the version a learner prints "
                  "will not match the one they installed."
              )
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={declared}\n")
          PY
        working-directory: .

      # `skip-existing: true` means re-publishing an existing version is a
      # silent no-op, which looks like a successful release that did nothing.
      # Say so here instead, while the reason is still obvious.
      - name: this version must not already be on PyPI
        run: |
          V="${{ steps.read.outputs.version }}"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/cooperative-marl-labs/$V/json")
          if [ "$CODE" = "200" ]; then
            echo "::error::cooperative-marl-labs $V is already on PyPI. PyPI never"
            echo "::error::allows a version to be replaced, so bump the version in"
            echo "::error::cooperative-marl-labs/pyproject.toml AND in"
            echo "::error::src/cooperative_marl_labs/__init__.py, then push again."
            exit 1
          fi
          echo "$V is not on PyPI yet, good to publish"
        working-directory: .

  # ----------------------------------------------------------------- 3. build
  build:
    name: build the distribution
    runs-on: ubuntu-latest
    needs: [test, version]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Show what will be uploaded
        run: ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: cooperative-marl-labs/dist/*
          if-no-files-found: error

  # -------------------------------------------------------- 4a. TestPyPI only
  testpypi:
    name: publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: testpypi
      url: https://test.pypi.org/project/cooperative-marl-labs/
    permissions:
      id-token: write   # trusted publishing; no token in secrets
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Whichever of the two is configured. The token step runs only when the
      # secret exists; otherwise trusted publishing handles it with no secret.
      - name: publish with an API token
        if: ${{ secrets.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN || secrets.PYPI_API_TOKEN }}
          skip-existing: true
      - name: publish with trusted publishing
        if: ${{ secrets.PYPI_API_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # ------------------------------------------------------------- 4b. real PyPI
  pypi:
    name: publish to PyPI
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/cooperative-marl-labs/
    permissions:
      id-token: write   # trusted publishing; no token in secrets
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: publish with an API token
        if: ${{ secrets.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
      - name: publish with trusted publishing
        if: ${{ secrets.PYPI_API_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # ----------------------------------- 5. prove the published wheel installs
  smoke:
    name: install from PyPI and import
    runs-on: ubuntu-latest
    # `version` is here because this job reads its output; a job can only
    # reference needs.<job> for jobs it actually depends on.
    needs: [pypi, version]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for the index to catch up
        run: sleep 60
      - name: Install the published version and run the documented imports
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cooperative-marl-labs==${{ needs.version.outputs.version }}"
          python - <<'PY'
          import cooperative_marl_labs
          from cooperative_marl_labs.envs import (
              SpeakerListenerEnv,
              PartnerCoordinationEnv,
              WirelessResourceAllocationEnv,
          )
          from cooperative_marl_labs.policies import FetchFirstPartner, HeldOutPartner
          from cooperative_marl_labs.agents import GreedyWirelessAgent
          from cooperative_marl_labs.evaluation import evaluate_agents

          env = WirelessResourceAllocationEnv(n_agents=4, n_channels=3)
          env.reset(seed=42)
          env.render()
          print("published", cooperative_marl_labs.__version__, "imports cleanly")
          PY
        working-directory: .
