name: cooperative-marl-labs

# Tests and builds the package. It deliberately does NOT publish: releasing is
# a manual decision, and trusted publishing has to be configured on PyPI first.
on:
  push:
    branches: [main]
    paths: ['cooperative-marl-labs/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['cooperative-marl-labs/**', '.github/workflows/ci.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: cooperative-marl-labs

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,learning]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: cooperative-marl-labs/dist/*
