name: cooperative-marl-labs

# Tests and builds the package. It deliberately does NOT publish: releasing is
# a manual decision, and trusted publishing has to be configured on PyPI first.
on:
  push:
    branches: [main]
    paths: ['cooperative-marl-labs/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['cooperative-marl-labs/**', '.github/workflows/ci.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: cooperative-marl-labs

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,learning]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

      # The reference pages are generated from these docstrings. If a
      # signature or a docstring changed without regenerating, the published
      # documentation is now lying about the package, so fail here.
      - name: Reference pages are up to date
        if: matrix.python-version == '3.13'
        working-directory: .
        run: |
          python3 scripts/docs/build_api_reference.py
          if ! git diff --quiet -- src/content/docs/package; then
            echo "::error::The API reference is stale. Run:"
            echo "::error::  python3 scripts/docs/build_api_reference.py"
            git diff --stat -- src/content/docs/package
            exit 1
          fi
          echo "reference pages match the package"

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: cooperative-marl-labs/dist/*
